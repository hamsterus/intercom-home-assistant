# V3 dashboard.
# The V3 custom card is stored in /local/intercom.v3.
# Add this resource in Lovelace resources if the dashboard is managed through UI:
#   - url: /local/intercom.v3/intercom-card-v3.js?v=3
#     type: module
#
# V3 runtime globals are isolated under IntercomServiceV3 / IntercomSIPV3 /
# IntercomCallsV3 / IntercomRGBV3.

views:
  - title: Домофон V3
    path: intercom-v3
    type: sections
    max_columns: 4
    sections:
      - type: grid
        columns: 37
        square: false
        cards:
          - type: custom:intercom-card-v3
            title: Домофон V3
            items:
              - entity: sensor.sip_9100
                name: Панель
              - entity: sensor.sip_9101
                name: Этаж
              - entity: sensor.sip_9102
                name: Подъезд
            grid_options:
              columns: 6
              rows: 10
