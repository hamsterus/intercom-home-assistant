# Intercom section used on the kiosk dashboard.
# The rest of the dashboard (clock/weather/calendar/Dreame/thermostat)
# is intentionally not duplicated here.

- type: grid
  columns: 37
  square: false
  cards:
    - type: conditional
      conditions:
        - condition: state
          entity: input_boolean.intercom_camera
          state: 'on'
      card:
        type: custom:webrtc-camera
        url: bas_ip
        ui: true
        muted: true
        background: false
        backlog: true
        style: |
          video::-webkit-media-controls-picture-in-picture-button { display:none !important; }
          video::-media-controls-picture-in-picture-button { display:none !important; }
          .pictureinpicture, .fullscreen, .mode { display:none !important; }
      grid_options:
        columns: 30
        rows: 10

    - type: conditional
      conditions:
        - condition: state
          entity: input_boolean.intercom_camera
          state: 'off'
      card:
        type: grid
        columns: 2
        square: false
        cards: []
      grid_options:
        rows: 10
        columns: 30

    - type: custom:intercom-card-v2
      title: Домофон
      items:
        - entity: sensor.sip_9100
          name: Панель
        - entity: sensor.sip_9101
          name: Этаж
        - entity: sensor.sip_9102
          name: Подъезд
      grid_options:
        columns: 6
        rows: 10

  column_span: 4
